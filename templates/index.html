<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic Comprehensive Rules</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="page-shell">
    <header id="page-top" class="hero">
      <p class="eyebrow">Magic: The Gathering</p>
      <h1>Comprehensive Rules</h1>
      <p class="hero-copy">
        A readable web version of MTG comprehensive rules.
      </p>
    </header>

    <div class="layout">
      <div id="mobile-search-slot" class="mobile-search-slot"></div>
      <aside class="toc-panel" aria-labelledby="toc-heading">
        <div class="toc-inner">
          <div class="toc-header">
            <h2 id="toc-heading">Contents</h2>
            <button
              id="toc-toggle"
              class="toc-toggle"
              type="button"
              aria-expanded="true"
              aria-controls="toc"
            >
              -
            </button>
          </div>
          <nav id="toc" class="toc" aria-label="Table of contents">
            <p class="loading">Loading contents…</p>
          </nav>
        </div>
      </aside>

      <main id="top" class="rules-panel">
        <div id="search-card-home"></div>
        <section class="card search-card" aria-label="Search or AI answer">
          <div class="search-mode-toggle" role="group" aria-label="Search mode">
            <button
              id="keyword-mode-button"
              class="search-mode-button is-active"
              type="button"
              data-search-mode="keyword"
              aria-pressed="true"
              disabled
            >
              Keyword Search
            </button>
            <button
              id="ai-mode-button"
              class="search-mode-button"
              type="button"
              data-search-mode="ai"
              aria-pressed="false"
              disabled
            >
              AI Answer
            </button>
          </div>

          <form id="search-form" class="search-form" role="search">
            <label class="sr-only" for="keyword-search">Search the rules text or ask AI</label>
            <input
              id="keyword-search"
              class="search-input"
              type="search"
              name="query"
              autocomplete="off"
              spellcheck="false"
              disabled
            >
            <button class="search-button" type="submit" disabled>Search</button>
          </form>

        </section>

        <section id="search-results-page" class="card search-page" aria-live="polite" hidden>
          <div class="search-page-header">
            <h2>Search Results</h2>
            <p id="search-page-summary" class="search-page-summary"></p>
          </div>
          <div id="search-results" class="search-results"></div>
        </section>

        <section id="ai-results-page" class="card search-page ai-results-page" aria-live="polite" hidden>
          <div class="search-page-header">
            <h2>AI Answer</h2>
            <p id="ai-page-summary" class="search-page-summary"></p>
          </div>
          <div id="ai-results" class="ai-results"></div>
        </section>

        <section id="intro" class="card intro-card" aria-live="polite">
          <p class="loading">Loading rules text…</p>
        </section>
        <article id="rules" class="rules-content" aria-label="Magic Comprehensive Rules"></article>
      </main>
    </div>
  </div>

  <div class="floating-actions" aria-label="Page actions">
    <a class="mobile-top-link" href="#page-top">Top</a>
  </div>

  <script>
    const RULE_FILE = {{ url_for('static', filename='MagicCompRules.txt') | tojson }};
    const RULE_730_SOUND_URL = {{ url_for('serve_sound', filename='sound1.mp3') | tojson }};
    const AI_ANSWER_API_URL = {{ url_for('api_ai_answer') | tojson }};
    const RULE_730_AUDIO_TIME_STORAGE_KEY = "mtg-rule-730-audio-time";
    const SEARCH_RESULT_LIMIT = 75;
    const SEARCH_MODE_KEYWORD = "keyword";
    const SEARCH_MODE_AI = "ai";
    const rule730Audio = new Audio(RULE_730_SOUND_URL);
    let isRule730AudioActive = false;
    const searchState = {
      records: [],
      recordsById: new Map(),
      latestResults: [],
      activeTerms: [],
      selectedTargetId: "",
      latestKeywordQuery: "",
      latestAiQuery: "",
      aiLoading: false,
      mode: SEARCH_MODE_KEYWORD,
    };

    rule730Audio.preload = "auto";
    rule730Audio.loop = true;

    function loadRule730AudioProgress() {
      try {
        const storedValue = window.localStorage.getItem(RULE_730_AUDIO_TIME_STORAGE_KEY);
        const parsedValue = Number(storedValue);
        return Number.isFinite(parsedValue) && parsedValue >= 0 ? parsedValue : 0;
      } catch (_error) {
        return 0;
      }
    }

    function saveRule730AudioProgress() {
      try {
        const currentTime = Number.isFinite(rule730Audio.currentTime) ? rule730Audio.currentTime : 0;
        window.localStorage.setItem(RULE_730_AUDIO_TIME_STORAGE_KEY, String(Math.max(0, currentTime)));
      } catch (_error) {
        // Ignore storage failures and keep playback working.
      }
    }

    function clearRule730AudioProgress() {
      try {
        window.localStorage.removeItem(RULE_730_AUDIO_TIME_STORAGE_KEY);
      } catch (_error) {
        // Ignore storage failures and keep playback working.
      }
    }

    function isRule730SectionActive() {
      const section = document.getElementById("rule-730");
      if (!section) {
        return false;
      }

      return section.open && !section.closest("[hidden]");
    }

    function syncRule730Audio() {
      const shouldPlay = isRule730SectionActive();
      if (shouldPlay === isRule730AudioActive) {
        return;
      }

      isRule730AudioActive = shouldPlay;

      if (shouldPlay) {
        rule730Audio.pause();
        rule730Audio.currentTime = loadRule730AudioProgress();
        rule730Audio.play().catch(() => {});
        return;
      }

      saveRule730AudioProgress();
      rule730Audio.pause();
      rule730Audio.currentTime = 0;
    }

    window.addEventListener("beforeunload", clearRule730AudioProgress);
    window.addEventListener("pagehide", clearRule730AudioProgress);

    function slugify(value) {
      return value
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    function makeSectionId(line) {
      const match = line.match(/^(\d{3})\.\s+/);
      if (match) {
        return `rule-${match[1]}`;
      }
      if (line === "Glossary") {
        return "glossary";
      }
      return slugify(line);
    }

    function makeChapterId(title) {
      return `chapter-${slugify(title)}`;
    }

    function makeRuleLineId(ruleNumber) {
      return `rule-${ruleNumber.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "")}`;
    }

    function findNthIndex(lines, value, occurrence) {
      let count = 0;
      for (let index = 0; index < lines.length; index += 1) {
        if (lines[index] === value) {
          count += 1;
          if (count === occurrence) {
            return index;
          }
        }
      }
      return -1;
    }

    function createParagraph(text, className) {
      const paragraph = document.createElement("p");
      appendLinkedRuleText(paragraph, text);
      if (className) {
        paragraph.className = className;
      }
      return paragraph;
    }

    function createRuleReferenceLink(ruleNumber) {
      const normalizedRuleNumber = ruleNumber.toLowerCase().replace(/\.$/, "");
      const link = document.createElement("a");
      link.className = "rule-ref-link";
      link.href = /^\d{3}$/.test(normalizedRuleNumber)
        ? `#rule-${normalizedRuleNumber}`
        : `#${makeRuleLineId(normalizedRuleNumber)}`;
      link.textContent = normalizedRuleNumber;
      return link;
    }

    function appendLinkedRuleText(element, text) {
      const referenceRegex = /\b(rule|rules)\s+((?:\d{3}(?:\.\d+[a-z]?)?)(?:\s*(?:,|and|or)\s+\d{3}(?:\.\d+[a-z]?)?)*)/gi;
      const ruleNumberRegex = /\d{3}(?:\.\d+[a-z]?)?/gi;
      let lastIndex = 0;

      Array.from(text.matchAll(referenceRegex)).forEach((match) => {
        const matchIndex = match.index ?? 0;
        if (matchIndex > lastIndex) {
          element.appendChild(document.createTextNode(text.slice(lastIndex, matchIndex)));
        }

        const [, prefix, references] = match;
        element.appendChild(document.createTextNode(`${prefix} `));

        let referenceIndex = 0;
        Array.from(references.matchAll(ruleNumberRegex)).forEach((referenceMatch) => {
          const numberIndex = referenceMatch.index ?? 0;
          if (numberIndex > referenceIndex) {
            element.appendChild(document.createTextNode(references.slice(referenceIndex, numberIndex)));
          }

          element.appendChild(createRuleReferenceLink(referenceMatch[0]));
          referenceIndex = numberIndex + referenceMatch[0].length;
        });

        if (referenceIndex < references.length) {
          element.appendChild(document.createTextNode(references.slice(referenceIndex)));
        }

        lastIndex = matchIndex + match[0].length;
      });

      if (lastIndex < text.length) {
        element.appendChild(document.createTextNode(text.slice(lastIndex)));
      }
    }

    function normalizeSearchText(value) {
      return value.toLowerCase().replace(/\s+/g, " ").trim();
    }

    function parseSearchTerms(query) {
      return query
        .toLowerCase()
        .trim()
        .split(/\s+/)
        .filter(Boolean);
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function escapeRegExp(value) {
      return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function buildSearchRegex(terms) {
      if (!terms.length) {
        return null;
      }

      const pattern = terms
        .slice()
        .sort((left, right) => right.length - left.length)
        .map((term) => escapeRegExp(term))
        .join("|");
      return new RegExp(`(${pattern})`, "gi");
    }

    function highlightMatchesInText(text, terms) {
      const regex = buildSearchRegex(terms);
      if (!regex) {
        return escapeHtml(text);
      }

      const matches = Array.from(text.matchAll(regex));
      if (!matches.length) {
        return escapeHtml(text);
      }

      let html = "";
      let lastIndex = 0;
      matches.forEach((match) => {
        const index = match.index ?? 0;
        html += escapeHtml(text.slice(lastIndex, index));
        html += `<mark class="search-highlight">${escapeHtml(match[0])}</mark>`;
        lastIndex = index + match[0].length;
      });
      html += escapeHtml(text.slice(lastIndex));
      return html;
    }

    function createSearchSnippet(text, terms, maxLength = 220) {
      if (!text) {
        return "";
      }

      const normalizedText = text.toLowerCase();
      const firstMatchIndex = terms.reduce((closest, term) => {
        const matchIndex = normalizedText.indexOf(term);
        if (matchIndex === -1) {
          return closest;
        }
        return closest === -1 ? matchIndex : Math.min(closest, matchIndex);
      }, -1);

      const focusIndex = firstMatchIndex === -1 ? 0 : firstMatchIndex;
      const start = Math.max(0, focusIndex - 80);
      const end = Math.min(text.length, start + maxLength);
      const snippet = text.slice(start, end).trim();
      const prefix = start > 0 ? "..." : "";
      const suffix = end < text.length ? "..." : "";
      return highlightMatchesInText(`${prefix}${snippet}${suffix}`, terms);
    }

    function createSearchRecord(records, data) {
      records.push({
        ...data,
        order: records.length,
        searchText: normalizeSearchText(data.searchText),
      });
    }

    function buildIntro(lines) {
      const intro = document.getElementById("intro");
      intro.replaceChildren();

      const nonEmpty = lines.map((line) => line.trim()).filter(Boolean);
      const [title, effectiveDate, ...rest] = nonEmpty;

      const introHeading = document.createElement("h2");
      introHeading.textContent = "Introduction";
      intro.appendChild(introHeading);

      if (title) {
        const sourceTitle = document.createElement("p");
        sourceTitle.className = "intro-source-title";
        sourceTitle.textContent = title;
        intro.appendChild(sourceTitle);
      }

      if (effectiveDate) {
        const effectiveNode = document.createElement("p");
        effectiveNode.className = "effective-date";
        effectiveNode.textContent = effectiveDate;
        intro.appendChild(effectiveNode);
      }

      rest.forEach((line) => {
        intro.appendChild(createParagraph(line));
      });
    }

    function parseContents(lines) {
      const chapters = [];
      let currentChapter = null;
      let reachedGlossary = false;

      lines.forEach((rawLine) => {
        const line = rawLine.trim();
        if (!line || reachedGlossary) {
          return;
        }

        if (/^\d+\.\s/.test(line) && !/^\d{3}\.\s/.test(line)) {
          currentChapter = { title: line, sections: [] };
          chapters.push(currentChapter);
          return;
        }

        if (/^\d{3}\.\s/.test(line)) {
          if (!currentChapter) {
            currentChapter = { title: "Rules", sections: [] };
            chapters.push(currentChapter);
          }
          currentChapter.sections.push({ title: line, id: makeSectionId(line) });
          return;
        }

        if (line === "Glossary") {
          chapters.push({ title: "Glossary", id: "glossary", standalone: true });
          currentChapter = null;
          reachedGlossary = true;
        }
      });

      return chapters;
    }

    function buildContents(chapters) {
      const toc = document.getElementById("toc");
      toc.replaceChildren();

      const fragment = document.createDocumentFragment();

      const introLink = document.createElement("a");
      introLink.className = "toc-standalone-link";
      introLink.href = "#intro";
      introLink.textContent = "Introduction";
      fragment.appendChild(introLink);

      chapters.forEach((chapter) => {
        if (chapter.standalone) {
          const link = document.createElement("a");
          link.className = "toc-standalone-link";
          link.href = `#${chapter.id}`;
          link.textContent = chapter.title;
          fragment.appendChild(link);
          return;
        }

        const link = document.createElement("a");
        link.className = "toc-chapter-link";
        link.href = `#${makeChapterId(chapter.title)}`;
        link.textContent = chapter.title;
        fragment.appendChild(link);
      });

      toc.appendChild(fragment);
    }

    function buildRules(lines, chapters) {
      const rulesRoot = document.getElementById("rules");
      rulesRoot.replaceChildren();

      const fragment = document.createDocumentFragment();
      const records = [];
      const chapterStarts = new Map(
        chapters
          .filter((chapter) => Array.isArray(chapter.sections) && chapter.sections.length > 0)
          .map((chapter) => [chapter.sections[0].title.slice(0, 3), chapter])
      );

      let currentChapter = null;
      let currentChapterTitle = "";
      let currentSection = null;
      let currentSectionBody = null;
      let currentSectionTitle = "";
      let currentNoteCount = 0;

      function flushChapter() {
        if (currentChapter) {
          fragment.appendChild(currentChapter);
          currentChapter = null;
        }
      }

      function flushSection() {
        if (currentSection) {
          currentChapter.querySelector(".chapter-sections").appendChild(currentSection);
          currentSection = null;
          currentSectionBody = null;
        }
      }

      lines.forEach((rawLine) => {
        const line = rawLine.trim();

        if (!line) {
          return;
        }

        const sectionMatch = line.match(/^(\d{3})\.\s+(.+)$/);
        if (sectionMatch) {
          flushSection();

          const [_, sectionNumber, sectionTitle] = sectionMatch;
          const chapter = chapterStarts.get(sectionNumber);
          if (chapter && (!currentChapter || currentChapter.id !== makeChapterId(chapter.title))) {
            flushChapter();
            currentChapterTitle = chapter.title;

            currentChapter = document.createElement("section");
            currentChapter.className = "chapter-block";
            currentChapter.id = makeChapterId(chapter.title);

            const chapterSummary = document.createElement("div");
            chapterSummary.className = "chapter-summary";

            const chapterHeading = document.createElement("span");
            chapterHeading.className = "chapter-heading";
            chapterHeading.textContent = chapter.title;
            chapterSummary.appendChild(chapterHeading);

            currentChapter.appendChild(chapterSummary);

            const chapterSections = document.createElement("div");
            chapterSections.className = "chapter-sections";
            currentChapter.appendChild(chapterSections);
          }

          currentSection = document.createElement("details");
          currentSection.className = "card rule-section";
          currentSection.id = `rule-${sectionNumber}`;
          currentSectionTitle = `${sectionNumber}. ${sectionTitle}`;
          currentNoteCount = 0;

          const summary = document.createElement("summary");
          summary.className = "rule-section-summary";

          const heading = document.createElement("span");
          heading.className = "rule-section-heading";
          heading.textContent = `${sectionNumber}. ${sectionTitle}`;
          summary.appendChild(heading);

          currentSection.appendChild(summary);

          currentSectionBody = document.createElement("div");
          currentSectionBody.className = "rule-section-body";
          currentSection.appendChild(currentSectionBody);

          createSearchRecord(records, {
            category: "Rule section",
            title: currentSectionTitle,
            subtitle: currentChapterTitle || "Rules",
            text: currentSectionTitle,
            searchText: `${currentChapterTitle} ${currentSectionTitle}`,
            targetId: currentSection.id,
            element: summary,
          });
          return;
        }

        const ruleLineMatch = line.match(/^(\d+\.\d+[a-z]?\.?)\s+(.*)$/i);
        if (ruleLineMatch && currentSectionBody) {
          const [_, ruleNumber, ruleText] = ruleLineMatch;
          const paragraph = document.createElement("p");
          paragraph.className = "rule-line";
          paragraph.id = makeRuleLineId(ruleNumber);

          const number = document.createElement("span");
          number.className = "rule-number";
          number.textContent = ruleNumber;
          paragraph.appendChild(number);
          appendLinkedRuleText(paragraph, ` ${ruleText}`);
          currentSectionBody.appendChild(paragraph);

          createSearchRecord(records, {
            category: "Rule line",
            title: `${ruleNumber} ${ruleText}`,
            subtitle: currentSectionTitle,
            text: `${ruleNumber} ${ruleText}`,
            searchText: `${currentChapterTitle} ${currentSectionTitle} ${ruleNumber} ${ruleText}`,
            targetId: paragraph.id,
            element: paragraph,
          });
          return;
        }

        if (currentSectionBody) {
          currentNoteCount += 1;
          const note = createParagraph(line, "rule-note");
          note.id = `${currentSection.id}-note-${currentNoteCount}`;
          currentSectionBody.appendChild(note);

          createSearchRecord(records, {
            category: "Rule note",
            title: line,
            subtitle: currentSectionTitle,
            text: line,
            searchText: `${currentChapterTitle} ${currentSectionTitle} ${line}`,
            targetId: note.id,
            element: note,
          });
        }
      });

      flushSection();
      flushChapter();
      rulesRoot.appendChild(fragment);
      return records;
    }

    function buildGlossary(lines) {
      const rulesRoot = document.getElementById("rules");
      const glossary = document.createElement("details");
      glossary.className = "card glossary-section";
      glossary.id = "glossary";

      const heading = document.createElement("summary");
      heading.className = "glossary-summary";

      const title = document.createElement("span");
      title.className = "glossary-heading";
      title.textContent = "Glossary";
      heading.appendChild(title);
      glossary.appendChild(heading);

      const glossaryBody = document.createElement("div");
      glossaryBody.className = "glossary-body";
      glossary.appendChild(glossaryBody);
      const records = [];

      function createEntry(term) {
        const entry = document.createElement("section");
        entry.className = "glossary-entry";
        entry.id = `glossary-${slugify(term)}`;

        const termHeading = document.createElement("h3");
        termHeading.textContent = term;
        entry.appendChild(termHeading);
        return entry;
      }

      const entries = [];
      let currentBlock = [];

      lines.forEach((rawLine) => {
        const line = rawLine.trim();
        if (!line) {
          if (currentBlock.length > 0) {
            entries.push(currentBlock);
            currentBlock = [];
          }
          return;
        }

        currentBlock.push(line);
      });

      if (currentBlock.length > 0) {
        entries.push(currentBlock);
      }

      const letterTargets = new Map();
      entries.forEach((entryLines) => {
        const term = entryLines[0] || "";
        const firstLetter = term.charAt(0).toUpperCase();
        if (/^[A-Z]$/.test(firstLetter) && !letterTargets.has(firstLetter)) {
          letterTargets.set(firstLetter, `glossary-${slugify(term)}`);
        }
      });

      const glossaryNav = document.createElement("nav");
      glossaryNav.className = "glossary-nav";
      glossaryNav.setAttribute("aria-label", "Glossary A to Z");

      "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach((letter) => {
        const targetId = letterTargets.get(letter);
        if (targetId) {
          const link = document.createElement("a");
          link.className = "glossary-nav-link";
          link.href = `#${targetId}`;
          link.textContent = letter;
          glossaryNav.appendChild(link);
          return;
        }

        const placeholder = document.createElement("span");
        placeholder.className = "glossary-nav-link is-disabled";
        placeholder.textContent = letter;
        placeholder.setAttribute("aria-hidden", "true");
        glossaryNav.appendChild(placeholder);
      });

      glossaryBody.appendChild(glossaryNav);

      entries.forEach((entryLines) => {
        const [term, ...descriptionLines] = entryLines;
        const entry = createEntry(term || "Terms");
        glossaryBody.appendChild(entry);

        descriptionLines.forEach((descriptionLine) => {
          entry.appendChild(createParagraph(descriptionLine));
        });

        createSearchRecord(records, {
          category: "Glossary",
          title: term || "Terms",
          subtitle: "Glossary entry",
          text: `${term || "Terms"} ${descriptionLines.join(" ")}`.trim(),
          searchText: `${term || "Terms"} ${descriptionLines.join(" ")}`.trim(),
          targetId: entry.id,
          element: entry,
        });
      });

      rulesRoot.appendChild(glossary);
      return records;
    }

    function clearActiveDocumentHighlights() {
      document.querySelectorAll("#intro mark.search-highlight, #rules mark.search-highlight").forEach((mark) => {
        const parent = mark.parentNode;
        if (!parent) {
          return;
        }

        parent.replaceChild(document.createTextNode(mark.textContent || ""), mark);
        parent.normalize();
      });
    }

    function highlightElementText(element, terms) {
      const regex = buildSearchRegex(terms);
      if (!regex || !element) {
        return;
      }

      const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          if (!node.nodeValue || !node.nodeValue.trim()) {
            return NodeFilter.FILTER_REJECT;
          }

          const parent = node.parentElement;
          if (!parent || parent.closest("mark.search-highlight")) {
            return NodeFilter.FILTER_REJECT;
          }

          if (["SCRIPT", "STYLE"].includes(parent.tagName)) {
            return NodeFilter.FILTER_REJECT;
          }

          return NodeFilter.FILTER_ACCEPT;
        },
      });

      const textNodes = [];
      let currentNode = walker.nextNode();
      while (currentNode) {
        textNodes.push(currentNode);
        currentNode = walker.nextNode();
      }

      textNodes.forEach((node) => {
        regex.lastIndex = 0;
        if (!regex.test(node.nodeValue)) {
          return;
        }

        regex.lastIndex = 0;
        const fragment = document.createDocumentFragment();
        let lastIndex = 0;

        Array.from(node.nodeValue.matchAll(regex)).forEach((match) => {
          const index = match.index ?? 0;
          if (index > lastIndex) {
            fragment.appendChild(document.createTextNode(node.nodeValue.slice(lastIndex, index)));
          }

          const mark = document.createElement("mark");
          mark.className = "search-highlight";
          mark.textContent = match[0];
          fragment.appendChild(mark);
          lastIndex = index + match[0].length;
        });

        if (lastIndex < node.nodeValue.length) {
          fragment.appendChild(document.createTextNode(node.nodeValue.slice(lastIndex)));
        }

        node.parentNode.replaceChild(fragment, node);
      });
    }

    function applyActiveDocumentHighlights() {
      clearActiveDocumentHighlights();

      if (!searchState.activeTerms.length) {
        return;
      }

      const targetId = searchState.selectedTargetId || window.location.hash.replace(/^#/, "");
      if (!targetId) {
        return;
      }

      const record = searchState.recordsById.get(targetId);
      if (!record) {
        return;
      }

      highlightElementText(record.element, searchState.activeTerms);
    }

    function getHashScrollTarget(target) {
      if (!target) {
        return null;
      }

      if (target.classList.contains("rule-section")) {
        return target.querySelector(".rule-section-summary") || target;
      }

      return target;
    }

    function isKeywordResultsTarget(target) {
      return Boolean(target && (target.id === "search-results-page" || target.closest("#search-results-page")));
    }

    function isAiResultsTarget(target) {
      return Boolean(target && (target.id === "ai-results-page" || target.closest("#ai-results-page")));
    }

    function isSearchInterfaceTarget(target) {
      return isKeywordResultsTarget(target) || isAiResultsTarget(target);
    }

    function hasKeywordSubmission() {
      return Boolean(searchState.latestKeywordQuery);
    }

    function hasAiSubmission() {
      return Boolean(searchState.latestAiQuery);
    }

    function clearSearchIfNavigatingAway(target) {
      const searchInput = document.getElementById("keyword-search");
      if (!searchInput || isSearchInterfaceTarget(target)) {
        return;
      }

      if (
        !searchInput.value &&
        !searchState.activeTerms.length &&
        !searchState.latestResults.length &&
        !searchState.latestKeywordQuery &&
        !searchState.latestAiQuery
      ) {
        return;
      }

      searchInput.value = "";
      resetSearchDisplay("");
    }

    function setVisibleBodyForTarget(target) {
      const intro = document.getElementById("intro");
      const searchPage = document.getElementById("search-results-page");
      const aiPage = document.getElementById("ai-results-page");
      const chapters = document.querySelectorAll(".chapter-block");
      const glossary = document.getElementById("glossary");

      chapters.forEach((chapter) => {
        chapter.hidden = true;
      });

      if (glossary) {
        glossary.hidden = true;
      }

      if (searchPage) {
        searchPage.hidden = true;
      }

      if (aiPage) {
        aiPage.hidden = true;
      }

      if (!target) {
        intro.hidden = false;
        syncRule730Audio();
        return;
      }

      if (target.id === "top" || target.id === "page-top") {
        intro.hidden = false;
        syncRule730Audio();
        return;
      }

      chapters.forEach((chapter) => {
        chapter.hidden = true;
      });

      if (glossary) {
        glossary.hidden = true;
      }

      intro.hidden = true;

      if (isKeywordResultsTarget(target)) {
        if (searchPage && hasKeywordSubmission()) {
          searchPage.hidden = false;
        }
        syncRule730Audio();
        return;
      }

      if (isAiResultsTarget(target)) {
        if (aiPage && hasAiSubmission()) {
          aiPage.hidden = false;
        }
        syncRule730Audio();
        return;
      }

      if (target.id === "intro") {
        intro.hidden = false;
        syncRule730Audio();
        return;
      }

      const chapterBlock = target.closest(".chapter-block");
      if (chapterBlock) {
        chapterBlock.hidden = false;
        syncRule730Audio();
        return;
      }

      if (target.classList.contains("chapter-block")) {
        target.hidden = false;
        syncRule730Audio();
        return;
      }

      if (target.id === "glossary" || target.closest("#glossary")) {
        if (glossary) {
          glossary.hidden = false;
        }
      }

      syncRule730Audio();
    }

    function revealTargetFromHash() {
      if (!window.location.hash) {
        setVisibleBodyForTarget(null);
        return;
      }

      const target = document.querySelector(window.location.hash);
      if (!target) {
        setVisibleBodyForTarget(null);
        clearSearchIfNavigatingAway(null);
        return;
      }

      syncSearchModeFromHash();
      setVisibleBodyForTarget(target);
      clearSearchIfNavigatingAway(target);

      let node = target;
      while (node) {
        if (node.tagName === "DETAILS") {
          node.open = true;
        }
        node = node.parentElement;
      }

      syncRule730Audio();

      const scrollTarget = getHashScrollTarget(target);
      if (scrollTarget) {
        const root = document.documentElement;
        const previousScrollBehavior = root.style.scrollBehavior;
        root.style.scrollBehavior = "auto";
        scrollTarget.scrollIntoView({ behavior: "auto", block: "start" });
        window.setTimeout(() => {
          root.style.scrollBehavior = previousScrollBehavior;
        }, 0);
      }

      applyActiveDocumentHighlights();
    }

    function jumpToHash(hash) {
      const targetId = hash.replace(/^#/, "");
      const target = targetId ? document.getElementById(targetId) : null;
      if (!target) {
        return;
      }

      const scrollTarget = getHashScrollTarget(target);

      const root = document.documentElement;
      const previousScrollBehavior = root.style.scrollBehavior;
      root.style.scrollBehavior = "auto";

      history.pushState(null, "", hash);
      revealTargetFromHash();
      scrollTarget.scrollIntoView({ behavior: "auto", block: "start" });

      window.setTimeout(() => {
        root.style.scrollBehavior = previousScrollBehavior;
      }, 0);
    }

    function navigateInPlaceToHash(hash) {
      const targetId = hash.replace(/^#/, "");
      const target = targetId ? document.getElementById(targetId) : null;
      if (!target) {
        return;
      }

      const root = document.documentElement;
      const previousScrollBehavior = root.style.scrollBehavior;
      const previousScrollY = window.scrollY;
      root.style.scrollBehavior = "auto";

      history.pushState(null, "", hash);
      setVisibleBodyForTarget(target);
      clearSearchIfNavigatingAway(target);
      applyActiveDocumentHighlights();
      window.scrollTo({ top: previousScrollY, behavior: "auto" });

      window.setTimeout(() => {
        root.style.scrollBehavior = previousScrollBehavior;
      }, 0);
    }

    function collapseOpenSections() {
      document.querySelectorAll(".rules-panel .rule-section[open]").forEach((section) => {
        section.open = false;
      });
      syncRule730Audio();
    }

    function resetToTop() {
      const pageTarget = document.getElementById("page-top");
      if (!pageTarget) {
        return;
      }

      collapseOpenSections();

      const root = document.documentElement;
      const previousScrollBehavior = root.style.scrollBehavior;
      root.style.scrollBehavior = "auto";

      pageTarget.scrollIntoView({ behavior: "auto", block: "start" });

      window.setTimeout(() => {
        root.style.scrollBehavior = previousScrollBehavior;
      }, 0);
    }

    function navigateHeroToIntro() {
      const hero = document.getElementById("page-top");
      const intro = document.getElementById("intro");
      if (!hero || !intro) {
        return;
      }

      const root = document.documentElement;
      const previousScrollBehavior = root.style.scrollBehavior;
      root.style.scrollBehavior = "auto";

      history.pushState(null, "", "#intro");
      setVisibleBodyForTarget(intro);
      clearSearchIfNavigatingAway(intro);
      applyActiveDocumentHighlights();
      hero.scrollIntoView({ behavior: "auto", block: "start" });

      window.setTimeout(() => {
        root.style.scrollBehavior = previousScrollBehavior;
      }, 0);
    }

    function rankSearchRecord(record, query, terms) {
      let score = 0;
      if (record.searchText.includes(normalizeSearchText(query))) {
        score += 10;
      }

      terms.forEach((term) => {
        const matches = record.searchText.split(term).length - 1;
        score += matches;
      });

      if (record.category === "Glossary") {
        score += 2;
      }

      if (record.category === "Rule section") {
        score += 1;
      }

      return score;
    }

    function searchRecords(query) {
      const terms = parseSearchTerms(query);
      if (!terms.length) {
        return [];
      }

      return searchState.records
        .filter((record) => terms.every((term) => record.searchText.includes(term)))
        .map((record) => ({
          ...record,
          score: rankSearchRecord(record, query, terms),
        }))
        .sort((left, right) => right.score - left.score || left.order - right.order);
    }

    function renderSearchResults(results, query, terms) {
      const resultsRoot = document.getElementById("search-results");
      const pageSummary = document.getElementById("search-page-summary");

      if (!query.trim()) {
        if (pageSummary) {
          pageSummary.textContent = "";
        }
        resultsRoot.replaceChildren();
        return;
      }

      if (!results.length) {
        if (pageSummary) {
          pageSummary.textContent = `No matches for "${query}".`;
        }
        resultsRoot.innerHTML = `
          <p class="search-empty">No rules text or glossary entries matched that search.</p>
        `;
        return;
      }

      const shownResults = results.slice(0, SEARCH_RESULT_LIMIT);
      const resultLabel = shownResults.length === results.length
        ? `${results.length} matches for "${query}".`
        : `Showing ${shownResults.length} of ${results.length} matches for "${query}".`;
      if (pageSummary) {
        pageSummary.textContent = resultLabel;
      }

      const fragment = document.createDocumentFragment();
      shownResults.forEach((result) => {
        const link = document.createElement("a");
        link.className = "search-result";
        link.href = `#${result.targetId}`;

        const meta = document.createElement("span");
        meta.className = "search-result-meta";
        meta.textContent = result.category;
        link.appendChild(meta);

        const title = document.createElement("strong");
        title.className = "search-result-title";
        title.innerHTML = highlightMatchesInText(result.title, terms);
        link.appendChild(title);

        const subtitle = document.createElement("span");
        subtitle.className = "search-result-subtitle";
        subtitle.innerHTML = escapeHtml(result.subtitle);
        link.appendChild(subtitle);

        const snippet = document.createElement("span");
        snippet.className = "search-result-snippet";
        snippet.innerHTML = createSearchSnippet(result.text, terms);
        link.appendChild(snippet);

        link.addEventListener("click", (event) => {
          event.preventDefault();
          searchState.selectedTargetId = result.targetId;
          jumpToHash(`#${result.targetId}`);
        });

        fragment.appendChild(link);
      });

      resultsRoot.replaceChildren(fragment);
    }

    function renderAiResults(responsePayload) {
      const pageSummary = document.getElementById("ai-page-summary");
      const resultsRoot = document.getElementById("ai-results");
      const query = String(responsePayload.query || "").trim();
      const answer = String(responsePayload.answer || "").trim();
      const sources = Array.isArray(responsePayload.sources) ? responsePayload.sources : [];

      searchState.latestAiQuery = query;
      if (pageSummary) {
        pageSummary.textContent = `Answer for "${query}"`;
      }

      const fragment = document.createDocumentFragment();

      const answerCard = document.createElement("section");
      answerCard.className = "ai-result-card";
      answerCard.setAttribute("aria-label", "AI answer");

      const answerBody = document.createElement("div");
      answerBody.className = "ai-answer-text";
      answerBody.textContent = answer || "No answer was returned.";
      answerCard.appendChild(answerBody);

      fragment.appendChild(answerCard);

      if (sources.length) {
        const sourcesSection = document.createElement("section");
        sourcesSection.className = "ai-sources";
        sourcesSection.setAttribute("aria-label", "Retrieved sources");

        const sourcesHeading = document.createElement("h3");
        sourcesHeading.className = "ai-sources-heading";
        sourcesHeading.textContent = "Retrieved Sources";
        sourcesSection.appendChild(sourcesHeading);

        const sourcesList = document.createElement("div");
        sourcesList.className = "ai-source-list";

        sources.forEach((source) => {
          const sourceCard = document.createElement("section");
          sourceCard.className = "ai-source-card";

          const sourceMeta = document.createElement("p");
          sourceMeta.className = "ai-source-meta";
          sourceMeta.textContent = `Source ${source.rank} | Score ${Number(source.score).toFixed(4)} | Line ${source.source_line}`;
          sourceCard.appendChild(sourceMeta);

          const sourceTitle = document.createElement("p");
          sourceTitle.className = "ai-source-title";
          sourceTitle.textContent = source.title;
          sourceCard.appendChild(sourceTitle);

          const sourceExcerpt = document.createElement("p");
          sourceExcerpt.className = "ai-source-excerpt";
          sourceExcerpt.textContent = source.excerpt;
          sourceCard.appendChild(sourceExcerpt);

          sourcesList.appendChild(sourceCard);
        });

        sourcesSection.appendChild(sourcesList);
        fragment.appendChild(sourcesSection);
      }

      resultsRoot.replaceChildren(fragment);
    }

    function runSearch(query) {
      const trimmedQuery = query.trim();
      if (!trimmedQuery) {
        resetSearchDisplay(query);
        return;
      }

      collapseMobileToc();
      searchState.latestKeywordQuery = trimmedQuery;
      searchState.latestAiQuery = "";
      searchState.selectedTargetId = "";
      searchState.activeTerms = parseSearchTerms(trimmedQuery);
      searchState.latestResults = searchRecords(trimmedQuery);
      renderSearchResults(searchState.latestResults, trimmedQuery, searchState.activeTerms);
      applyActiveDocumentHighlights();
      jumpToHash("#search-results-page");
    }

    function renderAiLoading(query) {
      const pageSummary = document.getElementById("ai-page-summary");
      const resultsRoot = document.getElementById("ai-results");
      const trimmedQuery = query.trim();

      searchState.latestAiQuery = trimmedQuery;
      if (pageSummary) {
        pageSummary.textContent = `Answer for "${trimmedQuery}"`;
      }

      resultsRoot.innerHTML = `
        <section class="ai-result-card" aria-label="AI answer loading">
          <p class="ai-result-body">Retrieving rules and drafting an answer...</p>
        </section>
      `;
    }

    function renderAiError(query, message) {
      const pageSummary = document.getElementById("ai-page-summary");
      const resultsRoot = document.getElementById("ai-results");
      const trimmedQuery = query.trim();

      searchState.latestAiQuery = trimmedQuery;
      if (pageSummary) {
        pageSummary.textContent = `Answer for "${trimmedQuery}"`;
      }

      resultsRoot.innerHTML = `
        <section class="ai-result-card ai-result-card-error" aria-label="AI answer error">
          <p class="ai-result-label">AI Answer</p>
          <p class="ai-result-query">${escapeHtml(trimmedQuery)}</p>
          <p class="ai-result-body">${escapeHtml(message)}</p>
        </section>
      `;
    }

    function updateSearchSubmitButton() {
      const searchForm = document.getElementById("search-form");
      const submitButton = searchForm ? searchForm.querySelector('button[type="submit"]') : null;
      if (!submitButton) {
        return;
      }

      if (!searchState.records.length) {
        submitButton.disabled = true;
        return;
      }

      if (searchState.aiLoading) {
        submitButton.textContent = "Asking...";
        submitButton.disabled = true;
        return;
      }

      submitButton.disabled = false;
      submitButton.textContent = searchState.mode === SEARCH_MODE_AI ? "Ask AI" : "Search";
    }

    async function runAiSearch(query) {
      const trimmedQuery = query.trim();
      if (!trimmedQuery) {
        resetSearchDisplay(query);
        return;
      }

      collapseMobileToc();
      searchState.aiLoading = true;
      searchState.latestKeywordQuery = "";
      searchState.selectedTargetId = "";
      searchState.activeTerms = [];
      searchState.latestResults = [];
      hideSearchResults();
      applyActiveDocumentHighlights();
      renderAiLoading(trimmedQuery);
      updateSearchSubmitButton();
      jumpToHash("#ai-results-page");

      try {
        const response = await fetch(AI_ANSWER_API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ query: trimmedQuery }),
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(payload.error || `AI request failed with status ${response.status}.`);
        }

        renderAiResults(payload);
      } catch (error) {
        renderAiError(trimmedQuery, error instanceof Error ? error.message : "AI request failed.");
      } finally {
        searchState.aiLoading = false;
        updateSearchSubmitButton();
      }
    }

    function hideSearchResults() {
      document.getElementById("search-results").replaceChildren();
    }

    function hideAiResults() {
      document.getElementById("ai-results").replaceChildren();
    }

    function getSearchModeFromHash() {
      if (window.location.hash === "#ai-results-page") {
        return SEARCH_MODE_AI;
      }

      return SEARCH_MODE_KEYWORD;
    }

    function syncSearchModeFromHash() {
      const nextMode = getSearchModeFromHash();
      if (searchState.mode !== nextMode) {
        setSearchMode(nextMode);
      }
    }

    function setSearchMode(mode, options = {}) {
      const nextMode = mode === SEARCH_MODE_AI ? SEARCH_MODE_AI : SEARCH_MODE_KEYWORD;
      const shouldNavigate = options.navigate === true;
      const searchCard = document.querySelector(".search-card");
      const searchForm = document.getElementById("search-form");
      const searchInput = document.getElementById("keyword-search");

      searchState.mode = nextMode;

      document.querySelectorAll(".search-mode-button").forEach((button) => {
        const isActive = button.dataset.searchMode === nextMode;
        button.classList.toggle("is-active", isActive);
        button.setAttribute("aria-pressed", isActive ? "true" : "false");
      });

      if (searchInput) {
        searchInput.placeholder = nextMode === SEARCH_MODE_AI ? "Ask AI" : "Search";
      }

      if (searchCard) {
        searchCard.setAttribute("aria-label", nextMode === SEARCH_MODE_AI ? "AI answer" : "Keyword search");
      }

      if (searchForm) {
        searchForm.setAttribute("aria-label", nextMode === SEARCH_MODE_AI ? "AI answer prompt" : "Keyword search");
      }

      updateSearchSubmitButton();
      resetSearchDisplay(searchInput ? searchInput.value : "");

      if (shouldNavigate) {
        navigateInPlaceToHash(nextMode === SEARCH_MODE_AI ? "#ai-results-page" : "#search-results-page");
      }
    }

    function resetSearchDisplay(query) {
      searchState.selectedTargetId = "";
      searchState.activeTerms = [];
      searchState.latestResults = [];
      searchState.latestKeywordQuery = "";
      searchState.latestAiQuery = "";
      hideSearchResults();
      hideAiResults();
      applyActiveDocumentHighlights();

      const pageSummary = document.getElementById("search-page-summary");
      const aiPageSummary = document.getElementById("ai-page-summary");
      if (pageSummary) {
        pageSummary.textContent = "";
      }
      if (aiPageSummary) {
        aiPageSummary.textContent = "";
      }

      const currentHash = window.location.hash;
      const currentTarget = currentHash ? document.querySelector(currentHash) : null;
      setVisibleBodyForTarget(currentTarget);
    }

    function initializeSearch(records) {
      searchState.records = records;
      searchState.recordsById = new Map(records.map((record) => [record.targetId, record]));

      const searchForm = document.getElementById("search-form");
      const searchInput = document.getElementById("keyword-search");
      const modeButtons = document.querySelectorAll(".search-mode-button");

      searchInput.disabled = false;
      modeButtons.forEach((button) => {
        button.disabled = false;
        button.addEventListener("click", () => {
          setSearchMode(button.dataset.searchMode, { navigate: true });
        });
      });

      searchInput.addEventListener("input", () => {
        resetSearchDisplay(searchInput.value);
      });

      searchForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        searchInput.blur();
        if (searchState.mode === SEARCH_MODE_AI) {
          await runAiSearch(searchInput.value);
          return;
        }

        runSearch(searchInput.value);
      });

      setSearchMode(getSearchModeFromHash());
      resetSearchDisplay("");
    }

    async function init() {
      try {
        const response = await fetch(RULE_FILE);
        if (!response.ok) {
          throw new Error(`Unable to load ${RULE_FILE} (${response.status})`);
        }

        const text = await response.text();
        const lines = text.split(/\r?\n/);
        const contentsIndex = lines.indexOf("Contents");
        const bodyStartIndex = findNthIndex(lines, "100. General", 2);
        const glossaryIndex = lines.lastIndexOf("Glossary");

        if (contentsIndex === -1 || bodyStartIndex === -1 || glossaryIndex === -1) {
          throw new Error("The rules file format was not recognized.");
        }

        const introLines = lines.slice(0, contentsIndex);
        const contentsLines = lines.slice(contentsIndex + 1, bodyStartIndex);
        const bodyLines = lines.slice(bodyStartIndex, glossaryIndex);
        const glossaryLines = lines.slice(glossaryIndex + 1);

        buildIntro(introLines);
        const chapters = parseContents(contentsLines);
        buildContents(chapters);
        const ruleRecords = buildRules(bodyLines, chapters);
        const glossaryRecords = buildGlossary(glossaryLines);
        initializeSearch([...ruleRecords, ...glossaryRecords]);
        bindRuleSectionAccordion();
        revealTargetFromHash();
        bindGlossaryNavInstantJump();
      } catch (error) {
        document.getElementById("toc").innerHTML = `
          <p class="error">Could not load the table of contents.</p>
        `;
        document.getElementById("intro").innerHTML = `
          <h2>Unable to load the rules text</h2>
          <p class="error">${error.message}</p>
          <p>Open this folder through a local web server so the browser can fetch <code>${RULE_FILE}</code>.</p>
        `;
      }
    }

    function bindRuleSectionAccordion() {
      document.querySelectorAll(".rule-section").forEach((section) => {
        const summary = section.querySelector(".rule-section-summary");
        if (!summary) {
          return;
        }

        summary.addEventListener("click", (event) => {
          event.preventDefault();
          const sectionGroup = section.closest(".chapter-sections");
          const willOpen = !section.open;

          if (!sectionGroup) {
            section.open = willOpen;
            syncRule730Audio();
            if (willOpen) {
              summary.scrollIntoView({ behavior: "auto", block: "start" });
            }
            return;
          }

          if (willOpen) {
            sectionGroup.querySelectorAll(".rule-section").forEach((peerSection) => {
              if (peerSection !== section) {
                peerSection.open = false;
              }
            });
          }

          section.open = willOpen;
          syncRule730Audio();
          if (!willOpen) {
            return;
          }

          summary.scrollIntoView({ behavior: "auto", block: "start" });
        });
      });
    }

    function bindGlossaryNavInstantJump() {
      document.querySelectorAll(".glossary-nav-link[href^='#']").forEach((link) => {
        link.addEventListener("click", (event) => {
          const hash = link.getAttribute("href");
          const target = hash ? document.querySelector(hash) : null;
          if (!target) {
            return;
          }

          event.preventDefault();
          jumpToHash(hash);
        });
      });
    }

    function syncMobileSearchPlacement() {
      const searchCard = document.querySelector(".search-card");
      const mobileSlot = document.getElementById("mobile-search-slot");
      const searchCardHome = document.getElementById("search-card-home");
      if (!searchCard || !mobileSlot || !searchCardHome) {
        return;
      }

      if (window.matchMedia("(max-width: 980px)").matches) {
        if (searchCard.parentElement !== mobileSlot) {
          mobileSlot.appendChild(searchCard);
        }
        return;
      }

      if (searchCard.parentElement !== searchCardHome.parentElement || searchCard.previousElementSibling !== searchCardHome) {
        searchCardHome.insertAdjacentElement("afterend", searchCard);
      }
    }

    function syncMobileTocCollapseState() {
      const toc = document.getElementById("toc");
      const toggle = document.getElementById("toc-toggle");
      const isMobile = window.matchMedia("(max-width: 980px)").matches;
      if (!toc || !toggle) {
        return;
      }

      if (!isMobile) {
        toc.hidden = false;
        toggle.hidden = true;
        toggle.setAttribute("aria-expanded", "true");
        toggle.textContent = "-";
        return;
      }

      toggle.hidden = false;
      if (!toggle.dataset.initialized) {
        toc.hidden = false;
        toggle.dataset.initialized = "true";
      }
      toggle.setAttribute("aria-expanded", toc.hidden ? "false" : "true");
      toggle.textContent = toc.hidden ? "+" : "-";
    }

    function collapseMobileToc() {
      const toc = document.getElementById("toc");
      const toggle = document.getElementById("toc-toggle");
      const isMobile = window.matchMedia("(max-width: 980px)").matches;
      if (!toc || !toggle || !isMobile) {
        return;
      }

      toc.hidden = true;
      toggle.setAttribute("aria-expanded", "false");
      toggle.textContent = "+";
    }

    function bindMobileTocToggle() {
      const toc = document.getElementById("toc");
      const toggle = document.getElementById("toc-toggle");
      if (!toc || !toggle) {
        return;
      }

      toggle.addEventListener("click", () => {
        if (!window.matchMedia("(max-width: 980px)").matches) {
          return;
        }

        toc.hidden = !toc.hidden;
        toggle.setAttribute("aria-expanded", toc.hidden ? "false" : "true");
        toggle.textContent = toc.hidden ? "+" : "-";
      });
    }

    function bindTopLinkReset() {
      document.querySelectorAll(".mobile-top-link").forEach((topLink) => {
        topLink.addEventListener("click", (event) => {
        event.preventDefault();
        resetToTop();
      });
      });
    }

    function bindHeroIntroNavigation() {
      const hero = document.getElementById("page-top");
      if (!hero) {
        return;
      }

      hero.addEventListener("click", (event) => {
        if (event.target instanceof Element && event.target.closest("a, button, input, textarea, select")) {
          return;
        }

        navigateHeroToIntro();
      });
    }

    window.addEventListener("hashchange", revealTargetFromHash);
    window.addEventListener("resize", syncMobileSearchPlacement);
    window.addEventListener("resize", syncMobileTocCollapseState);

    bindMobileTocToggle();
    bindHeroIntroNavigation();
    bindTopLinkReset();
    syncMobileSearchPlacement();
    syncMobileTocCollapseState();
    init();
  </script>
</body>
</html>
